<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Una última parada entre las estrellas.">

    <meta name="theme-color" content="#000005">

    <title>Una última parada — Universo de Cartas</title>

    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>

<body>

    <main id="final-universe" aria-label="Vista final del universo">

        <!-- Fondo animado de estrellas -->
        <canvas id="final-starfield" aria-hidden="true"></canvas>

        <!--
            La luna funciona como portal.
            El botón musical se añade desde final.js.
        -->
        <button class="moon-portal" type="button" aria-label="Regresar al universo con los ocho planetas abiertos">
            <img src="planetas/luna-dita.png" alt="" draggable="false">
        </button>

    </main>

    <!-- Motor gráfico para el campo estelar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Lógica de la vista final -->
    <script src="js/final.js"></script>

</body>

</html>
